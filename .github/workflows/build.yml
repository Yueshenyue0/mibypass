name: Build MiBypass
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android project files
        run: flutter create . --project-name mibypass --org com.eri --platforms android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Add permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="mibypass"|android:label="Delta Tool"|' android/app/src/main/AndroidManifest.xml
          grep -n 'INTERNET' android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-mibypass.apk
          ls -la app-mibypass.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mibypass-apk
          path: app-mibypass.apk
          if-no-files-found: error
          retention-days: 14